name: inkept
options:
  bundleIdPrefix: com.chemical-pink
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  groupSortPosition: top
  xcodeVersion: "26.0"
packages:
  FSRS:
    url: https://github.com/open-spaced-repetition/swift-fsrs.git
    revision: 4fbaf20184d62f82a9f44f343337c61a2c5483e9
  Textual:
    url: https://github.com/gonzalezreal/textual.git
    exactVersion: 0.2.0
  SwiftUIMath:
    url: https://github.com/gonzalezreal/swiftui-math.git
    exactVersion: 0.1.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: KX98K6BPAP
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  inkept:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: inkept
        excludes:
          - Resources/TypstPackages
          - Resources/TypstTemplates
      - path: inkept/Resources/TypstPackages
        type: folder
        buildPhase: resources
      - path: inkept/Resources/TypstTemplates
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Build the Typst engine
        script: "\"${PROJECT_DIR}/Scripts/build-typst.sh\""
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/InkeptTypst/libinkept_typst.a
        basedOnDependencyAnalysis: false
    info:
      path: inkept/Resources/Info.plist
      properties:
        CFBundleDisplayName: inkept
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ATSApplicationFontsPath: .
        UIAppFonts:
          - Neucha.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: Save flashcards as images to your photo library.
        NSHumanReadableCopyright: © 2026 chemical-pink. Free and open source under the MIT license.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSUbiquitousContainers:
          iCloud.com.chemical-pink.inkept:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: inkept
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chemical-pink.inkept
        PRODUCT_NAME: inkept
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: inkept/Resources/inkept-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: inkept/Resources/inkept-iOS.entitlements
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: $(inherited) @executable_path/../Frameworks
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Typst/include
        LIBRARY_SEARCH_PATHS: $(BUILT_PRODUCTS_DIR)/InkeptTypst
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: FSRS
        product: FSRS
      - package: Textual
        product: Textual
      - package: SwiftUIMath
        product: SwiftUIMath
  inkeptTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: inkeptTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chemical-pink.inkept.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Typst/include
        LIBRARY_SEARCH_PATHS: $(BUILT_PRODUCTS_DIR)/InkeptTypst
    dependencies:
      - target: inkept
      - package: Textual
        product: Textual
schemes:
  inkept:
    build:
      targets:
        inkept: all
        inkeptTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - inkeptTests
